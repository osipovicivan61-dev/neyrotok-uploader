# NeyroTok uploader: stores a generated video in the private archive repository.
# The NeyroTok server sends a repository_dispatch (event "archive") with the file name and the generator's address;
# this job downloads the file from the generator and puts it into the archive, so the video never passes through
# the NeyroTok server (whose hosting plan has little traffic). Public repository: GitHub Actions minutes are free.
# Secrets: ARCHIVE_TOKEN (contents read/write on the archive), GROK_IMG_KEY and VEO_API_KEY (for those providers).
# Nothing secret and no address is printed to the log.
name: archive
on:
  repository_dispatch:
    types: [archive]
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Store the file in the archive
        env:
          SRC_URL: ${{ github.event.client_payload.url }}
          AUTH: ${{ github.event.client_payload.auth }}
          NAME: ${{ github.event.client_payload.name }}
          KIND: ${{ github.event.client_payload.kind }}
          META: ${{ github.event.client_payload.meta }}
          ARCHIVE_REPO: ${{ github.event.client_payload.repo }}
          BRANCH: ${{ github.event.client_payload.branch }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          GROK_IMG_KEY: ${{ secrets.GROK_IMG_KEY }}
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, time, urllib.error, urllib.request

          name = os.environ.get('NAME', '')
          kind = os.environ.get('KIND', '')
          url = os.environ.get('SRC_URL', '')
          auth = os.environ.get('AUTH', '')
          repo = os.environ.get('ARCHIVE_REPO', '')
          branch = os.environ.get('BRANCH') or 'main'
          if not re.fullmatch(r'[A-Za-z0-9_.\-]{5,200}\.(mp4|png|jpe?g|webp)', name):
              sys.exit('bad name')
          if kind not in ('videos', 'photos'):
              sys.exit('bad kind')
          if not re.fullmatch(r'[\w.\-]+/[\w.\-]+', repo):
              sys.exit('bad repo')
          if not url.startswith('https://'):
              sys.exit('bad address')

          src_headers = {'User-Agent': 'neyrotok-uploader'}
          if auth == 'grok':
              src_headers['Authorization'] = 'Bearer ' + os.environ.get('GROK_IMG_KEY', '')
          elif auth == 'veo':
              src_headers['Authorization'] = 'Bearer ' + os.environ.get('VEO_API_KEY', '')

          LIMIT = 95 * 1024 * 1024
          data = None
          for attempt in range(1, 5):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=src_headers), timeout=180) as r:
                      data = r.read(LIMIT + 1)
                  break
              except Exception as e:
                  print(f'download try {attempt}: {type(e).__name__} {getattr(e, "code", "")}')
                  time.sleep(5 * attempt)
          if not data or len(data) < 500:
              sys.exit('no file')
          if len(data) > LIMIT:
              sys.exit('file too big for the archive')
          print(f'downloaded {len(data) // 1024} KB')

          gh = {
              'Authorization': 'Bearer ' + os.environ.get('ARCHIVE_TOKEN', ''),
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'neyrotok-uploader',
              'Content-Type': 'application/json',
          }

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}',
                  method=method,
                  headers=gh,
                  data=json.dumps(body).encode() if body is not None else None,
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return 0

          def put(path, content, message):
              if call('GET', f'{path}?ref={branch}') == 200:
                  return True
              for attempt in range(1, 8):
                  st = call('PUT', path, {'message': message, 'content': base64.b64encode(content).decode(), 'branch': branch})
                  if st in (200, 201):
                      return True
                  if call('GET', f'{path}?ref={branch}') == 200:
                      return True
                  print(f'store try {attempt}: HTTP {st}')
                  time.sleep(3 * attempt)
              return False

          if not put(f'{kind}/{name}', data, f'archive {kind[:-1]} {name}'):
              sys.exit('could not store the file')
          try:
              meta = json.loads(os.environ.get('META') or '{}')
              if not isinstance(meta, dict):
                  meta = {}
          except Exception:
              meta = {}
          meta.update({'name': name, 'kind': kind, 'size': len(data), 'archivedAt': time.strftime('%Y-%m-%dT%H:%M:%S.000Z', time.gmtime())})
          put(f'meta/{name}.json', json.dumps(meta, ensure_ascii=False, indent=2).encode(), f'archive meta {name}')
          print('stored')
          PY
