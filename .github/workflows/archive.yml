# NeyroTok uploader: stores a generated video in the private archive repository.
# The NeyroTok server sends a repository_dispatch (event "archive") with the file name and the generator's address;
# this job downloads the file from the generator and puts it into the archive, so the video never passes through
# the NeyroTok server (whose hosting plan has little traffic).
# Secrets: ARCHIVE_TOKEN (contents read/write on the archive), GROK_IMG_KEY, VEO_API_KEY, SARANC_API_KEY, VIDGEN_API_KEY, AIVID_API_KEY and VIVAGEN_API_KEY (for those providers).
# Discord bot videos also get a copy with the NeyroTok watermark (videos/<name>__wm.mp4, script in wm/).
# Nothing secret, no address and no prompt is printed to the log (the request is read from the event file).
name: archive
# the file name in the run's title lets the NeyroTok server see at once that this file's upload failed
run-name: archive ${{ github.event.client_payload.name }}
on:
  repository_dispatch:
    types: [archive]
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # reading this public repository's own files (the watermark script, wm/)
    permissions:
      contents: read
    steps:
      # Discord bot videos (payload "wm": nick and format): the watermarked copy is made here, in seconds;
      # the bot's own server needed about 4 minutes for it
      - name: Get the watermark script
        if: ${{ github.event.client_payload.wm }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: wm
          persist-credentials: false
      - name: Install the watermark script
        if: ${{ github.event.client_payload.wm }}
        run: npm ci --prefix wm --no-audit --no-fund --silent
      - name: Store the file in the archive
        # the request's details are read from the event file, not passed as env: env values are shown in the log
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          GROK_IMG_KEY: ${{ secrets.GROK_IMG_KEY }}
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
          SARANC_API_KEY: ${{ secrets.SARANC_API_KEY }}
          VIDGEN_API_KEY: ${{ secrets.VIDGEN_API_KEY }}
          AIVID_API_KEY: ${{ secrets.AIVID_API_KEY }}
          VIVAGEN_API_KEY: ${{ secrets.VIVAGEN_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, time, urllib.error, urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              payload = (json.load(f) or {}).get('client_payload') or {}
          name = str(payload.get('name') or '')
          kind = str(payload.get('kind') or '')
          url = str(payload.get('url') or '')
          auth = str(payload.get('auth') or '')
          repo = str(payload.get('repo') or '')
          branch = str(payload.get('branch') or '') or 'main'
          meta_raw = payload.get('meta') or '{}'
          # make the video smaller before storing (480 or 360 on the short side), asked by the site; 0 keeps it as it is
          try:
              scale = int(payload.get('scale') or 0)
          except Exception:
              scale = 0
          if scale and not 144 <= scale <= 1080:
              scale = 0
          if not re.fullmatch(r'[A-Za-z0-9_.\-]{5,200}\.(mp4|png|jpe?g|webp)', name):
              sys.exit('bad name')
          if kind not in ('videos', 'photos'):
              sys.exit('bad kind')
          if not re.fullmatch(r'[\w.\-]+/[\w.\-]+', repo):
              sys.exit('bad repo')
          if not (url.startswith('https://') or (auth == 'saranc' and url.startswith('http://'))):
              sys.exit('bad address')

          src_headers = {'User-Agent': 'neyrotok-uploader'}
          if auth == 'grok':
              src_headers['Authorization'] = 'Bearer ' + os.environ.get('GROK_IMG_KEY', '').strip()
          elif auth == 'veo':
              src_headers['Authorization'] = 'Bearer ' + os.environ.get('VEO_API_KEY', '').strip()
          elif auth == 'saranc' and os.environ.get('SARANC_API_KEY', '').strip():
              src_headers['Authorization'] = 'Bearer ' + os.environ.get('SARANC_API_KEY', '').strip()
          elif auth == 'vidgen' and os.environ.get('VIDGEN_API_KEY', '').strip():
              src_headers['X-Api-Key'] = os.environ.get('VIDGEN_API_KEY', '').strip()
          elif auth == 'aivid' and os.environ.get('AIVID_API_KEY', '').strip():
              src_headers['X-API-Key'] = os.environ.get('AIVID_API_KEY', '').strip()
          elif auth == 'viva' and os.environ.get('VIVAGEN_API_KEY', '').strip():
              src_headers['X-API-Key'] = os.environ.get('VIVAGEN_API_KEY', '').strip()

          # a 16-second video: the second part (same generator, same key), joined to the first one below
          join = str(payload.get('join') or '')
          if join and not join.startswith('https://'):
              sys.exit('bad second address')

          LIMIT = 95 * 1024 * 1024
          def download(address, label):
              got = None
              for attempt in range(1, 5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(address, headers=src_headers), timeout=180) as r:
                          got = r.read(LIMIT + 1)
                      break
                  except Exception as e:
                      print(f'{label} download try {attempt}: {type(e).__name__} {getattr(e, "code", "")}')
                      time.sleep(5 * attempt)
              if not got or len(got) < 500:
                  sys.exit(f'no file ({label})')
              if len(got) > LIMIT:
                  sys.exit('file too big for the archive')
              print(f'{label}: downloaded {len(got) // 1024} KB')
              return got
          data = download(url, 'file')

          if join and kind == 'videos':
              # the second part starts from the first one's last frame; a 0.35 s crossfade of picture and sound hides
              # the joint (the NeyroTok server joins the same way when it has to store the file itself)
              import subprocess, tempfile
              second = download(join, 'second part')
              FADE = 0.35
              def probe(f):
                  def q(args):
                      return subprocess.run(['ffprobe', '-v', 'error', *args, '-of', 'default=nw=1:nk=1', f],
                                            capture_output=True, text=True, timeout=60).stdout.strip()
                  dur = float(q(['-show_entries', 'format=duration']) or 8)
                  wh = q(['-select_streams', 'v:0', '-show_entries', 'stream=width,height']).split()
                  rate = q(['-select_streams', 'v:0', '-show_entries', 'stream=avg_frame_rate']) or '24/1'
                  num, _, den = rate.partition('/')
                  fps = float(num) / float(den or 1) if float(den or 1) else 24.0
                  audio = bool(q(['-select_streams', 'a', '-show_entries', 'stream=index']))
                  w = int(wh[0]) if len(wh) > 1 else 720
                  h = int(wh[1]) if len(wh) > 1 else 1280
                  return dur, w - w % 2, h - h % 2, min(60.0, fps if fps > 0 else 24.0), audio
              with tempfile.TemporaryDirectory() as tmp:
                  fa, fb, out = (os.path.join(tmp, n) for n in ('a.mp4', 'b.mp4', 'out.mp4'))
                  with open(fa, 'wb') as f:
                      f.write(data)
                  with open(fb, 'wb') as f:
                      f.write(second)
                  da, W, H, fps, aa = probe(fa)
                  db, _, _, _, ab = probe(fb)
                  fit = f'fps={fps:.3f},scale={W}:{H}:force_original_aspect_ratio=increase,crop={W}:{H},setsar=1,format=yuv420p,settb=AVTB'
                  offset = max(0.5, da - FADE)
                  args = ['ffmpeg', '-y', '-hide_banner', '-loglevel', 'error', '-i', fa, '-i', fb]
                  graph = f'[0:v]{fit}[va];[1:v]{fit}[vb];[va][vb]xfade=transition=fade:duration={FADE}:offset={offset:.3f}[v]'
                  sound = aa or ab
                  if sound:
                      sa, sb, extra = '0:a', '1:a', 2
                      if not aa:
                          args += ['-f', 'lavfi', '-t', f'{da:.3f}', '-i', 'anullsrc=r=48000:cl=stereo']
                          sa = f'{extra}:a'
                          extra += 1
                      if not ab:
                          args += ['-f', 'lavfi', '-t', f'{db:.3f}', '-i', 'anullsrc=r=48000:cl=stereo']
                          sb = f'{extra}:a'
                      af = 'aresample=48000,aformat=sample_fmts=fltp:channel_layouts=stereo'
                      graph += f';[{sa}]{af}[aa];[{sb}]{af}[ab];[aa][ab]acrossfade=d={FADE}[a]'
                  args += ['-filter_complex', graph, '-map', '[v]']
                  if sound:
                      args += ['-map', '[a]', '-c:a', 'aac', '-b:a', '128k']
                  args += ['-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20', '-pix_fmt', 'yuv420p', '-movflags', '+faststart', out]
                  try:
                      subprocess.run(args, check=True, timeout=480)
                  except Exception as e:
                      sys.exit(f'could not join the parts: {type(e).__name__}')
                  with open(out, 'rb') as f:
                      data = f.read()
                  if len(data) < 1000:
                      sys.exit('empty join')
                  print(f'joined two parts: {len(data) // 1024} KB, about {da + db - FADE:.1f} s')

          if scale and kind == 'videos':
              import subprocess, tempfile
              with tempfile.TemporaryDirectory() as tmp:
                  src = os.path.join(tmp, 'in.mp4')
                  dst = os.path.join(tmp, 'out.mp4')
                  with open(src, 'wb') as f:
                      f.write(data)
                  vf = f"scale='if(lt(iw,ih),{scale},-2)':'if(lt(iw,ih),-2,{scale})'"
                  cmd = ['ffmpeg', '-y', '-hide_banner', '-loglevel', 'error', '-i', src, '-vf', vf,
                         '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '26', '-pix_fmt', 'yuv420p',
                         '-c:a', 'aac', '-b:a', '96k', '-movflags', '+faststart', dst]
                  try:
                      subprocess.run(cmd, check=True, timeout=300)
                      with open(dst, 'rb') as f:
                          small = f.read()
                      if 1000 < len(small) < len(data):
                          print(f'made smaller to {scale}p: {len(small) // 1024} KB')
                          data = small
                  except Exception as e:
                      print(f'could not make it smaller: {type(e).__name__}')

          gh = {
              'Authorization': 'Bearer ' + os.environ.get('ARCHIVE_TOKEN', ''),
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'neyrotok-uploader',
              'Content-Type': 'application/json',
          }

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}',
                  method=method,
                  headers=gh,
                  data=json.dumps(body).encode() if body is not None else None,
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return 0

          def put(path, content, message):
              if call('GET', f'{path}?ref={branch}') == 200:
                  return True
              for attempt in range(1, 8):
                  st = call('PUT', path, {'message': message, 'content': base64.b64encode(content).decode(), 'branch': branch})
                  if st in (200, 201):
                      return True
                  if call('GET', f'{path}?ref={branch}') == 200:
                      return True
                  print(f'store try {attempt}: HTTP {st}')
                  time.sleep(3 * attempt)
              return False

          # the watermarked copy for the Discord bot goes first: when the original appears, the copy is already there
          # (or it could not be made, and the bot puts the mark on itself)
          wm = payload.get('wm') if isinstance(payload.get('wm'), dict) else None
          if wm and kind == 'videos' and name.endswith('.mp4') and os.path.isfile('wm/mark.mjs'):
              import subprocess, tempfile
              nick = re.sub(r'[^A-Za-z0-9_.\-]', '', str(wm.get('nick') or ''))[:40] or 'neyrotok'
              aspect = '16:9' if str(wm.get('aspect') or '') == '16:9' else '9:16'
              try:
                  with tempfile.TemporaryDirectory() as tmp:
                      src = os.path.join(tmp, 'in.mp4')
                      dst = os.path.join(tmp, 'out.mp4')
                      with open(src, 'wb') as f:
                          f.write(data)
                      subprocess.run(['node', 'wm/mark.mjs', src, dst, nick, aspect], check=True, timeout=300)
                      with open(dst, 'rb') as f:
                          marked = f.read()
                  if len(marked) > 1000:
                      wm_name = name[:-4] + '__wm.mp4'
                      print('watermarked copy stored' if put(f'videos/{wm_name}', marked, f'archive watermark {wm_name}') else 'watermarked copy not stored')
              except Exception as e:
                  print(f'no watermarked copy: {type(e).__name__}')

          if not put(f'{kind}/{name}', data, f'archive {kind[:-1]} {name}'):
              sys.exit('could not store the file')
          try:
              meta = json.loads(meta_raw) if isinstance(meta_raw, str) else meta_raw
              if not isinstance(meta, dict):
                  meta = {}
          except Exception:
              meta = {}
          meta.update({'name': name, 'kind': kind, 'size': len(data), 'archivedAt': time.strftime('%Y-%m-%dT%H:%M:%S.000Z', time.gmtime())})
          put(f'meta/{name}.json', json.dumps(meta, ensure_ascii=False, indent=2).encode(), f'archive meta {name}')
          print('stored')
          PY
